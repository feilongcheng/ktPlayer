<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KTPlayer Demo</title>
    <link rel="stylesheet" href="./dist/ktPlayer.min.css">
    <script src="./dist/ktPlayer.min.js"></script>
    <style>
        body{
            background:url(./images/bg.png) repeat;
        }
        #container{
            width:777px;
            margin:100px auto 0;
        }
    </style>
</head>
<body>
<iframe frameborder="0" scrolling="0" width="91px" height="20px" src="https://ghbtns.com/github-btn.html?user=feilongcheng&repo=ktPlayer&type=star&count=true"></iframe>
<div id="container"></div>
<script>
    window.onload = function(){
        var player = new KTPlayer({
            src:'demo/yellowstone.mp4',
            pic:'demo/yellowstone.jpg',
            root:document.getElementById('container')
        });
        player.init();
    };
</script>
</body>
</html>
